[package]
name = "meshdash-core"
description = "Configuration, storage, event bus and module registry. No domain logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
meshdash-proto.workspace = true
meshdash-transport.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
# `test-util` is not part of tokio's `full`; it provides the paused clock that
# makes backoff timing testable without actually waiting.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
