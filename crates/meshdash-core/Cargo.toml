[package]
name = "meshdash-core"
description = "Configuration, storage, event bus and module registry. No domain logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
meshdash-proto.workspace = true
meshdash-transport.workspace = true
async-trait.workspace = true
# Needed for the routes a module contributes. The core does not serve HTTP —
# meshdash-server does — but the contract has to name the type modules hand over.
axum.workspace = true
figment.workspace = true
serde.workspace = true
# Carries the payload of AppEvent::Module, whose shape the core does not know.
# See docs/decisions/0007-modul-ereignisse.md.
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
# `test-util` is not part of tokio's `full`; it provides the paused clock that
# makes backoff timing testable without actually waiting.
tokio = { workspace = true, features = ["test-util"] }
# `test` provides Jail, which runs a test in its own directory and environment
# so configuration loading can be checked without touching the real ones.
figment = { workspace = true, features = ["test"] }
serde_json.workspace = true

[lints]
workspace = true
