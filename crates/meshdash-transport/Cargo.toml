[package]
name = "meshdash-transport"
description = "Node connections: serial, TCP, mock, later BLE. No protocol knowledge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
meshdash-proto.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
# Deliberately without the `libudev` feature, which is not enabled by default:
# it would add a system library to every Linux build just to enumerate ports,
# and we open a port by path from the configuration. See docs/development.md.
tokio-serial.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true }

